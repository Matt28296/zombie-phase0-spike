<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Phase 0 — Zombie Multiplayer Spike</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#111; color:#eee; }
  #wrap { max-width: 760px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 18px; margin: 4px 0 8px; }
  canvas { display:block; width:100%; background:#1c2b1c; border:1px solid #444; touch-action:none; }
  #hud { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:6px; margin:10px 0; }
  .stat { background:#222; border:1px solid #333; border-radius:6px; padding:6px 8px; font-size:13px; }
  .stat b { display:block; font-size:11px; color:#aaa; text-transform:uppercase; }
  #log { background:#000; border:1px solid #333; border-radius:6px; height:130px; overflow-y:auto; padding:8px; font:12px monospace; white-space:pre-wrap; }
  #players { background:#222; border:1px solid #333; border-radius:6px; padding:8px; font:12px monospace; margin-top:8px; }
  .ok { color:#2ecc71; } .bad { color:#e74c3c; }
  #touch { display:flex; gap:8px; margin-top:10px; }
  #touch button { flex:1; padding:14px 0; font-size:18px; background:#2a2a2a; color:#eee; border:1px solid #555; border-radius:8px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Phase 0 — Network Spike (movement only)</h1>
  <canvas id="game" width="600" height="600"></canvas>
  <div id="hud">
    <div class="stat"><b>Status</b><span id="status">connecting…</span></div>
    <div class="stat"><b>Player ID</b><span id="pid">—</span></div>
    <div class="stat"><b>Position</b><span id="pos">—</span></div>
    <div class="stat"><b>RTT</b><span id="rtt">—</span></div>
    <div class="stat"><b>Snapshots/s</b><span id="snapRate">—</span></div>
    <div class="stat"><b>Players</b><span id="count">0</span></div>
  </div>
  <div id="players">no players yet</div>
  <div id="log"></div>
  <div id="touch">
    <button data-k="left">◀</button>
    <button data-k="up">▲</button>
    <button data-k="down">▼</button>
    <button data-k="right">▶</button>
  </div>
  <p style="font-size:12px;color:#999">WASD / arrows to move. Open this page in a second browser or phone — both players should see each other move.</p>
</div>
<script>
(function () {
  'use strict';
  const ARENA = 60, SPEED = 5, CORRECT_THRESHOLD = 0.5;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const logEl = $('log');

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  // --- state ---
  let myId = null, myColor = '#fff';
  let pred = { x: 30, y: 30 };          // predicted local position
  let keys = { up: false, down: false, left: false, right: false };
  let seq = 0, lastSentKeys = '';
  let prevSnap = null, latestSnap = null, prevSnapAt = 0, latestSnapAt = 0;
  let snapCount = 0, snapWindowStart = Date.now();
  let corrections = 0;
  let rtt = null;

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host);
  log('connecting to ' + proto + '//' + location.host);

  ws.onopen = () => { $('status').textContent = 'connected'; $('status').className = 'ok'; log('websocket open'); };
  ws.onclose = () => { $('status').textContent = 'disconnected'; $('status').className = 'bad'; log('websocket closed'); };
  ws.onerror = () => { $('status').textContent = 'error'; $('status').className = 'bad'; log('websocket error'); };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'welcome') {
      myId = msg.id; myColor = msg.color;
      pred = { x: msg.x, y: msg.y };
      $('pid').textContent = myId;
      latestSnap = { tick: 0, players: msg.players };
      log(`welcome as ${myId} at (${msg.x.toFixed(1)}, ${msg.y.toFixed(1)})`);
    } else if (msg.type === 'snapshot') {
      prevSnap = latestSnap; prevSnapAt = latestSnapAt;
      latestSnap = msg; latestSnapAt = performance.now();
      snapCount++;
      reconcile();
    } else if (msg.type === 'pong') {
      rtt = Date.now() - msg.t;
      $('rtt').textContent = rtt + ' ms';
    }
  };

  // --- reconciliation: snap server position for the local player ---
  function reconcile() {
    if (!myId || !latestSnap) return;
    const srv = latestSnap.players.find(p => p.id === myId);
    if (!srv) return;
    const dx = srv.x - pred.x, dy = srv.y - pred.y;
    const dist = Math.hypot(dx, dy);
    if (dist > CORRECT_THRESHOLD) {
      corrections++;
      // smooth correction: move 30% of the way toward the server position
      pred.x += dx * 0.3; pred.y += dy * 0.3;
      log(`correction #${corrections}: server (${srv.x.toFixed(2)}, ${srv.y.toFixed(2)}) vs predicted (${(pred.x - dx * 0.3).toFixed(2)}, ${(pred.y - dy * 0.3).toFixed(2)}) — off by ${dist.toFixed(2)}`);
    }
  }

  // --- input ---
  const KEYMAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
  window.addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    const k = KEYMAP[e.code];
    if (k) { keys[k] = false; e.preventDefault(); }
  });
  // touch buttons
  document.querySelectorAll('#touch button').forEach(btn => {
    const k = btn.dataset.k;
    const on = e => { e.preventDefault(); keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener('touchstart', on); btn.addEventListener('touchend', off);
    btn.addEventListener('mousedown', on); btn.addEventListener('mouseup', off); btn.addEventListener('mouseleave', off);
  });

  // --- send input when it changes, cap ~60 Hz ---
  function sendInput() {
    const k = JSON.stringify(keys);
    if (k !== lastSentKeys) {
      lastSentKeys = k;
      seq++;
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', seq, keys }));
      }
    }
  }

  // --- ping every 1s ---
  setInterval(() => {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping', t: Date.now() }));
  }, 1000);

  // --- snapshot rate display every 1s ---
  setInterval(() => {
    const now = Date.now();
    $('snapRate').textContent = (snapCount * 1000 / (now - snapWindowStart)).toFixed(1);
    snapCount = 0; snapWindowStart = now;
  }, 1000);

  // --- main loop: prediction + render ---
  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    // client-side prediction (same speed/bounds as server)
    let dx = 0, dy = 0;
    if (keys.up) dy -= 1; if (keys.down) dy += 1;
    if (keys.left) dx -= 1; if (keys.right) dx += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      pred.x = Math.min(ARENA, Math.max(0, pred.x + (dx / len) * SPEED * dt));
      pred.y = Math.min(ARENA, Math.max(0, pred.y + (dy / len) * SPEED * dt));
    }
    sendInput();

    // --- render ---
    const scale = canvas.width / ARENA;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#2c3e2c';
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(i * 100, 0); ctx.lineTo(i * 100, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * 100); ctx.lineTo(canvas.width, i * 100); ctx.stroke();
    }

    if (latestSnap) {
      // interpolate remote players between prev and latest snapshot
      const t = latestSnapAt && prevSnapAt && latestSnapAt > prevSnapAt
        ? Math.min(1, (performance.now() - latestSnapAt) / (latestSnapAt - prevSnapAt))
        : 1;
      for (const p of latestSnap.players) {
        let x = p.x, y = p.y;
        if (p.id !== myId && prevSnap) {
          const prev = prevSnap.players.find(q => q.id === p.id);
          if (prev) { x = prev.x + (p.x - prev.x) * t; y = prev.y + (p.y - prev.y) * t; }
        } else if (p.id === myId) {
          x = pred.x; y = pred.y; // local player renders from prediction
        }
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(x * scale, y * scale, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
        ctx.fillText(p.id, x * scale, y * scale - 16);
      }
      $('count').textContent = latestSnap.players.length;
      $('players').textContent = latestSnap.players
        .map(p => `${p.id} ${p.id === myId ? '(you)' : ''} x=${p.x.toFixed(2)} y=${p.y.toFixed(2)} ${p.color}`)
        .join('\n');
    }

    if (myId) $('pos').textContent = `${pred.x.toFixed(2)}, ${pred.y.toFixed(2)}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
